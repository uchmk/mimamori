# yagura's built-in keymap. A keymap.toml beside config.toml is laid over
# it, section by section, the way yazi's and kura's are: `keymap` replaces a
# section's list, `prepend_keymap` and `append_keymap` go before and after it.
#
# `on` is one key token or several separated by spaces ("g g"), or an array
# of tokens; `on_mac` is used instead on macOS.
#
# C = Ctrl on Windows and Linux, Cmd on macOS (where Ctrl works too).
# <C-,> is Ctrl+, (Cmd+, on a Mac).

[main]
keymap = [
    { on = "1", run = "screen overview", desc = "Overview" },
    { on = "2", run = "screen cpu", desc = "CPU" },
    { on = "3", run = "screen mem", desc = "Memory" },
    { on = "4", run = "screen gpu", desc = "GPU / NPU" },
    { on = "5", run = "screen procs", desc = "Processes" },
    { on = "6", run = "screen svc", desc = "Services" },
    { on = "7", run = "screen net", desc = "Network" },
    { on = "8", run = "screen disk", desc = "Disks" },
    { on = "9", run = "screen sensors", desc = "Sensors" },
    { on = "0", run = "screen sys", desc = "System" },
    { on = "D", run = "screen devices", desc = "Devices (Device Manager, USB)" },
    { on = "F", run = "fleet", desc = "Fleet: every machine" },
    { on = "]", run = "machine next", desc = "Next machine (this one, then the hosts that are up)" },
    { on = "[", run = "machine prev", desc = "Previous machine" },
    { on = "<Tab>", run = "screen next", desc = "Next screen" },
    { on = "<BackTab>", run = "screen prev", desc = "Previous screen" },

    { on = "j", run = "arrow 1", desc = "Down" },
    { on = "<Down>", run = "arrow 1", desc = "Down" },
    { on = "k", run = "arrow -1", desc = "Up" },
    { on = "<Up>", run = "arrow -1", desc = "Up" },
    { on = "g g", run = "arrow top", desc = "First row" },
    { on = "<Home>", run = "arrow top", desc = "First row" },
    { on = "G", run = "arrow bot", desc = "Last row" },
    { on = "<End>", run = "arrow bot", desc = "Last row" },
    { on = "<C-d>", run = "arrow 50%", desc = "Half a page down" },
    { on = "<C-u>", run = "arrow -50%", desc = "Half a page up" },
    { on = "<PageDown>", run = "arrow 100%", desc = "A page down" },
    { on = "<PageUp>", run = "arrow -100%", desc = "A page up" },
    { on = "h", run = "focus left", desc = "Column to the left" },
    { on = "<Left>", run = "focus left", desc = "Column to the left" },
    { on = "l", run = "focus right", desc = "Column to the right" },
    { on = "<Right>", run = "focus right", desc = "Column to the right" },

    # tsumugi's pane keys: Alt+Shift+arrow, Cmd+Ctrl+arrow on a Mac (where
    # Cmd and Ctrl are both C).
    { on = "<A-S-Left>", on_mac = "<C-Left>", run = "resize left", desc = "Move the divider left" },
    { on = "<A-S-Right>", on_mac = "<C-Right>", run = "resize right", desc = "Move the divider right" },
    { on = "<A-S-Up>", on_mac = "<C-Up>", run = "resize up", desc = "Move the divider up" },
    { on = "<A-S-Down>", on_mac = "<C-Down>", run = "resize down", desc = "Move the divider down" },
    { on = "<C-S-e>", run = "equalize", desc = "Columns back to equal widths" },

    { on = "<Enter>", run = "enter", desc = "Open the selection" },
    { on = "/", run = "filter", desc = "Filter processes, services, connections or devices" },
    { on = "s", run = "sort", desc = "Next sort column" },
    { on = "t", run = "tree", desc = "Tree of parents and children (devices: what hangs off what) / list" },
    { on = "u", run = "scope", desc = "Scope: every process / mine; connections: all / listening; svc: services / drivers" },
    { on = "x", run = "kill", desc = "End the process; on svc, stop the service" },
    { on = "S", run = "service start", desc = "Start the selected service" },
    { on = "R", run = "service restart", desc = "Restart the selected service" },
    { on = "P", run = "pause", desc = "Pause / resume sampling" },
    { on = "+", run = "interval +", desc = "Sample less often" },
    { on = "=", run = "interval +", desc = "Sample less often" },
    { on = "-", run = "interval -", desc = "Sample more often" },
    { on = "y", run = "copy", desc = "Copy (devices: the id; fleet: the sample [[host]], or the machine's address)" },
    { on = "?", run = "help", desc = "Help" },
    { on = "<F1>", run = "help", desc = "Help" },
    { on = "<C-,>", run = "settings", desc = "Settings" },
    # The scale every uchmk app shares (common.toml). `<C-;>` is for JIS
    # keyboards, where + is Shift+;.
    { on = "<C-=>", run = "scale in", desc = "Zoom in" },
    { on = "<C-+>", run = "scale in", desc = "Zoom in" },
    { on = "<C-;>", run = "scale in", desc = "Zoom in" },
    { on = "<C-->", run = "scale out", desc = "Zoom out" },
    { on = "<C-0>", run = "scale reset", desc = "Zoom to 100%" },
    { on = "q", run = "quit", desc = "Quit" },
    { on = "<C-q>", run = "quit", desc = "Quit" },
    { on = "<Esc>", run = "escape", desc = "Clear the filter (and on net the interface)" },
]

# The filter's line: other printable keys are typed into it.
[input]
keymap = [
    { on = "<Enter>", run = "confirm", desc = "Keep the filter" },
    { on = "<Esc>", run = "escape", desc = "Drop the filter" },
    { on = "<Backspace>", run = "backspace", desc = "Delete a character" },
]

[help]
keymap = [
    { on = "?", run = "escape", desc = "Close" },
    { on = "<F1>", run = "escape", desc = "Close" },
    { on = "q", run = "escape", desc = "Close" },
    { on = "<C-=>", run = "scale in", desc = "Zoom in" },
    { on = "<C-+>", run = "scale in", desc = "Zoom in" },
    { on = "<C-;>", run = "scale in", desc = "Zoom in" },
    { on = "<C-->", run = "scale out", desc = "Zoom out" },
    { on = "<C-0>", run = "scale reset", desc = "Zoom to 100%" },
    { on = "<Esc>", run = "escape", desc = "Close" },
    { on = "j", run = "arrow 1", desc = "Down" },
    { on = "<Down>", run = "arrow 1", desc = "Down" },
    { on = "k", run = "arrow -1", desc = "Up" },
    { on = "<Up>", run = "arrow -1", desc = "Up" },
]

# The question before a process is ended (`x`) or a service is started,
# stopped or restarted (`S`, `x`, `R` on svc).
[confirm]
keymap = [
    { on = "y", run = "confirm", desc = "Yes" },
    { on = "<Enter>", run = "confirm", desc = "Yes" },
    { on = "n", run = "escape", desc = "No, leave it as it is" },
    { on = "<Esc>", run = "escape", desc = "No, leave it as it is" },
    { on = "q", run = "escape", desc = "No, leave it as it is" },
]

# A graph opened full size (double click it): the range it looks back over.
[zoom]
keymap = [
    { on = "<Esc>", run = "escape", desc = "Close" },
    { on = "q", run = "escape", desc = "Close" },
    { on = "<Enter>", run = "enter", desc = "Close" },
    { on = "]", run = "page next", desc = "Look further back" },
    { on = "<Right>", run = "page next", desc = "Look further back" },
    { on = "l", run = "page next", desc = "Look further back" },
    { on = "[", run = "page prev", desc = "Look closer" },
    { on = "<Left>", run = "page prev", desc = "Look closer" },
    { on = "h", run = "page prev", desc = "Look closer" },
    { on = "<C-=>", run = "scale in", desc = "Zoom in" },
    { on = "<C-+>", run = "scale in", desc = "Zoom in" },
    { on = "<C-;>", run = "scale in", desc = "Zoom in" },
    { on = "<C-->", run = "scale out", desc = "Zoom out" },
    { on = "<C-0>", run = "scale reset", desc = "Zoom to 100%" },
]

# The settings screen (as tsumugi's): only these keys are taken, every other
# goes to its fields and lists (Tab between them, Space and Enter to press).
# Esc first leaves the field being typed in, then closes the screen.
[settings]
keymap = [
    { on = "<Esc>", run = "escape", desc = "Close" },
    { on = "<C-,>", run = "settings", desc = "Close" },
    { on = "<C-Tab>", run = "page next", desc = "Next page" },
    { on = "<C-PageDown>", run = "page next", desc = "Next page" },
    { on = "<C-BackTab>", run = "page prev", desc = "Previous page" },
    { on = "<C-PageUp>", run = "page prev", desc = "Previous page" },
    { on = "<C-f>", run = "search", desc = "Search the settings" },
    { on = "<C-=>", run = "scale in", desc = "Zoom in" },
    { on = "<C-+>", run = "scale in", desc = "Zoom in" },
    { on = "<C-;>", run = "scale in", desc = "Zoom in" },
    { on = "<C-->", run = "scale out", desc = "Zoom out" },
    { on = "<C-0>", run = "scale reset", desc = "Zoom to 100%" },
]
