[package]
name = "mimamori"
version = "0.25.0"
edition = "2024"
rust-version = "1.95"
description = "A keyboard-driven system monitor: cores and threads at a glance"
license = "MIT OR Apache-2.0"
repository = "https://github.com/uchmk/mimamori"

[dependencies]
eframe = "0.36"
egui = "0.36"
sysinfo = { version = "0.39", default-features = false, features = ["disk", "network", "system", "user"] }
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
toml = "1.1"
dirs = "7"
sys-locale = "0.3"
png = "0.18"
# The split tree behind the resizable panels, shared with tsumugi and filer.
# Pinned to the commit filer reads; to take a fix, move `rev` and run
# `cargo build` so Cargo.lock follows. It depends on nothing but egui.
tsumugi-layout = { git = "https://github.com/uchmk/tsumugi", rev = "085c421f5c3c738f9d5782c39aae68d31ee7db37", features = ["egui", "serde"] }

# NVIDIA's management library, loaded at run time: without the driver it is
# simply not there and no NVIDIA device is listed from it. macOS has no NVML.
[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
nvml-wrapper = { version = "0.13", default-features = false }

# launchd's plists, XML or binary: pure Rust. The tests read plists on every
# OS, so it is a dev-dependency too. sysinfo's components are the SMC and HID
# temperatures; Linux and Windows read their sensors themselves. The drives
# are read from IOKit through the bindings sysinfo already uses, and a
# volume's device from `statfs`.
[target.'cfg(target_os = "macos")'.dependencies]
plist = { version = "1.8", default-features = false }
sysinfo = { version = "0.39", default-features = false, features = ["component"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFBase", "CFData", "CFDictionary", "CFNumber", "CFPlugInCOM", "CFString", "CFUUID"] }
objc2-io-kit = { version = "0.3", default-features = false, features = ["std", "libc"] }
libc = "0.2"

[dev-dependencies]
plist = { version = "1.8", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Wdk_Graphics_Direct3D",
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Performance",
    "Win32_System_Power",
    "Win32_System_Services",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
