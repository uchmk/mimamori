name: Re-test / 再テスト
description: Rows whose behaviour changed, for the x64 lane to press again / 動きが変わった行。x64 のレーンがもう一度押す
labels: [retest]
body:
  - type: markdown
    attributes:
      value: |
        Opened by the session that changed the behaviour, after taking the rows' `[x]` off in
        TESTING.md. The x64 lane takes the oldest open `retest` issue first, ticks rows here
        as it presses them, and its pull request says `Closes #N` once all are ticked (`Refs #N` before).
        The ARM64 lane does not take re-tests.

        動きを変えたセッションが、TESTING.md の `[x]` を外してから立てます。x64 のレーンはいちばん古いものから取り、
        押した行をここで `[x]` にし、全部済んだら PR に `Closes #N` と書きます。ARM64 のレーンは再テストを取りません。

  - type: input
    id: rev
    attributes:
      label: Version that changed them / 変えた版
      placeholder: v0.57.1
    validations:
      required: true

  - type: textarea
    id: rows
    attributes:
      label: Rows / 行
      description: One row ID per line, as a checklist. / 1 行に 1 つ、チェックリストで。
      value: |
        - [ ] 3d.8
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: What changed / 何が変わったか
