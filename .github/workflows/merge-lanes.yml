name: Merge lanes

# yagura has no real-machine lanes, so this only does the bookkeeping kura's
# and tsumugi's Merge lanes do besides merging (v0.42.0): it keeps the issue
# labels in step and counts the votes on question issues (`vote[cloud]:` and
# `vote[win]:` comments, the owner's `回答:`), labelling them vote-decided,
# needs-owner or answered. The script is ito's scripts/lanes/merge-lanes.py
# (copied by scripts/lanes.sh sync); RULES picks this repository's rules.
#
# It runs on a comment on a question issue, once a day as a fallback, and by
# hand. Its own comments start no workflows, so it does not wake itself.

on:
  issue_comment:
    types: [created, edited]
  schedule:
    - cron: '17 21 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Say what would change, change nothing
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: merge-lanes
  cancel-in-progress: false

jobs:
  merge:
    if: github.event_name != 'issue_comment' || (!github.event.issue.pull_request && contains(github.event.issue.labels.*.name, 'question'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Self-test
        run: python3 scripts/merge-lanes.py --self-test
      - name: Labels and votes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MERGE_LANES_DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python3 scripts/merge-lanes.py
