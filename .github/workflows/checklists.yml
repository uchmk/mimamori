name: Checklists

# TESTING.md's rows keep the form the lane scripts read (tests/checklist.rs):
# a section heading over each row, the row's ID first, one of the three marks,
# no ID twice. Unlike kura's and minato's, yagura's checklist is TESTING.md
# itself, with nothing generated from it. Not skipped for Markdown, unlike CI:
# a lane's pull request changes TESTING.md alone, and merge-lanes.py waits for
# this job (`checklists`) before it merges one that ticks rows.
on:
  push:
    branches: [main]
    paths: ['TESTING.md', 'tests/checklist.rs', '.github/workflows/checklists.yml', 'Cargo.toml', 'Cargo.lock']
  pull_request:
    paths: ['TESTING.md', 'tests/checklist.rs', '.github/workflows/checklists.yml', 'Cargo.toml', 'Cargo.lock']
  # merge-lanes.py starts it after pushing its share, since that push starts
  # no workflows.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  checklists:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          key: checklists
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The test is std only, but Cargo builds yagura's binaries for any
      # integration test, so this takes as long as a build.
      - run: cargo test --locked --test checklist
